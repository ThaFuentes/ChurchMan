<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Prophecy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      background-image: url('{{ url_for("static", filename="images/settings_background.png") }}');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }
    .header {
      position: relative;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #00FFFF;
    }
    .header h1 {
      margin: 0;
      color: #00FFFF;
      font-size: 2em;
    }
    .back-button {
      position: absolute;
      left: 20px;
      top: 20px;
      background-color: #00FFFF;
      color: #000;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9em;
    }
    .save-button {
      background-color: #00FFFF;
      color: #000;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .form-container {
      max-width: 600px;
      margin: 30px auto;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #00FFFF;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #00FFFF;
      border-radius: 4px;
      background-color: #111;
      color: #e0e0e0;
      font-size: 1em;
    }
    textarea {
      resize: vertical;
      min-height: 150px;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="{{ url_for('prophecy.list_prophecies') }}" class="back-button">← Back to Prophecies</a>
    <h1>Edit Prophecy</h1>
  </div>

  <div class="form-container">
    <form method="POST" action="{{ url_for('prophecy.edit_prophecy', prophecy_id=prophecy.id) }}">
      <label for="title">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        value="{{ prophecy.title }}"
        required
      />

      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        required
      >{{ prophecy.description }}</textarea>

      <button type="submit" class="save-button">Save Changes</button>
    </form>
  </div>

</body>
</html>
