<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Send Email</title>
  <style>
    /* Base Styles */
    body {
      font-family: Arial, sans-serif;
      background: #000 url('{{ url_for("static", filename="images/prayer.png") }}') center/cover fixed;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }
    a {
      text-decoration: none;
    }

    /* Header */
    .header {
      position: relative;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #00FFFF;
    }
    .header h1 {
      margin: 0;
      color: #00FFFF;
      font-size: 2em;
    }
    .header .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #00FFFF;
      color: #000;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      transition: transform 0.2s;
    }
    .header .back-button:hover {
      transform: scale(1.05);
    }

    /* Email Form Styles */
    .container {
      width: 50%;
      max-width: 600px;
      margin: 100px auto;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #00FFFF;
      border-radius: 4px;
      font-size: 16px;
      background: #000;
      color: #e0e0e0;
      resize: vertical;
    }

    button {
      background-color: #00aaff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0088cc;
    }

    /* Flash Messages */
    .flash {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 1em;
    }
    .flash.success {
      background-color: #4caf50;
      color: white;
    }
    .flash.error {
      background-color: #f44336;
      color: white;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        width: 90%;
        margin: 50px auto;
      }
      .header h1 {
        font-size: 1.5em;
      }
      button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <a href="{{ url_for('dashboard') }}" class="back-button">Back to Dashboard</a>
  <h1>Send Email</h1>
</div>

<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Email Sending Form -->
  <form action="{{ url_for('email.send_email_route') }}" method="POST">
    <div class="form-group">
      <label for="to_email">Recipient Email</label>
      <input
        type="email"
        id="to_email"
        name="to_email"
        placeholder="Enter recipient's email"
        required
        value="{{ to_email|default('') }}"
        autocomplete="email"
      >
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input
        type="text"
        id="subject"
        name="subject"
        placeholder="Enter email subject"
        required
        value="{{ subject|default('') }}"
      >
    </div>

    <div class="form-group">
      <label for="body">Body</label>
      <textarea
        id="body"
        name="body"
        rows="6"
        placeholder="Enter email body"
        required
      >{{ body|default('') }}</textarea>
    </div>

    <button type="submit">Send Email</button>
  </form>
</div>

</body>
</html>
