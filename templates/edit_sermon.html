<!-- templates/edit_sermon.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Sermon</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      background-image: url('{{ url_for("static", filename="images/settings_background.png") }}');
      background-size: cover;
      background-position: center center;
      margin: 0; padding: 0;
    }
    .flash {
      max-width: 800px; margin: 20px auto;
      padding: 10px; border-radius: 4px; text-align: center;
    }
    .flash.error   { background-color: #661111; color: #fdd; }
    .flash.success { background-color: #116611; color: #dfd; }
    .header {
      position: relative; padding: 20px; text-align: center;
      background-color: rgba(0,0,0,0.8); border-bottom: 2px solid #00FFFF;
    }
    .header h1 { margin: 0; color: #00FFFF; font-size: 2em; }
    .header .back-button {
      position: absolute; left: 20px; top: 20px;
      background: #00FFFF; color: #000; padding: 8px 16px;
      border-radius: 4px; text-decoration: none; font-weight: bold;
    }
    .form-container {
      max-width: 800px; margin: 20px auto;
      background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px;
    }
    .form-row { margin-bottom: 15px; }
    .form-row label {
      display: block; margin-bottom: 5px; font-weight: bold;
    }
    .form-row input[type="text"],
    .form-row input[type="url"],
    .form-row textarea {
      width: 100%; padding: 8px; border: 1px solid #333;
      border-radius: 4px; background: #1f1f1f; color: #e0e0e0;
    }
    .form-row input[type="file"] { color: #e0e0e0; }
    .form-row textarea { min-height: 100px; resize: vertical; }
    .submit-btn {
      background: #00FFFF; color: #000; border: none;
      padding: 10px 20px; border-radius: 4px; font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover { background: #00e5e5; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <a href="{{ url_for('sermons.sermons') }}" class="back-button">
      ← Back to Sermons
    </a>
    <h1>Edit Sermon</h1>
  </div>

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Edit Form -->
  <div class="form-container">
    <form action="{{ url_for('sermons.edit_sermon', sermon_id=sermon.id) }}"
          method="POST"
          enctype="multipart/form-data">

      <div class="form-row">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title"
               value="{{ sermon.title }}" required>
      </div>

      <div class="form-row">
        <label for="author">Author *</label>
        <input type="text" id="author" name="author"
               value="{{ sermon.author }}" required>
      </div>

      <div class="form-row">
        <label for="sermon_notes">Replace Notes File</label>
        <input type="file" id="sermon_notes" name="sermon_notes"
               accept=".txt,.docx,.pdf">
      </div>

      <div class="form-row">
        <label for="sermon_file">Replace Sermon File</label>
        <input type="file" id="sermon_file" name="sermon_file"
               accept=".mp3,.mp4,.pdf,.jpg,.png,.docx,.txt">
      </div>

      <div class="form-row">
        <label for="external_link">External Link</label>
        <input type="url" id="external_link" name="external_link"
               value="{{ sermon.external_link or '' }}">
      </div>

      <div class="form-row">
        <label for="details">Details</label>
        <textarea id="details" name="details">{{ sermon.details }}</textarea>
      </div>

      <button type="submit" class="submit-btn">Save Changes</button>
    </form>
  </div>

</body>
</html>
