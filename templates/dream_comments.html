<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comments for {{ dream.title }}</title>
  <style>
    body { background:#000; color:#e0e0e0; font-family:Arial,sans-serif; }
    .header { padding:20px; text-align:center; border-bottom:2px solid #00ffff; }
    .header h1 { color:#00ffff; }
    .back { color:#00ffff; text-decoration:none; position:absolute; left:20px; top:20px; background:#00ffff; color:#000; padding:8px; border-radius:4px;}
    .comment { margin:10px 0; padding:10px; background:rgba(0,0,0,0.7); border:1px solid #00ffff; }
    .comment small { color:#888; }
    form textarea { width:100%; height:80px; background:#111; color:#eee; border:1px solid #00ffff; }
    form button { margin-top:8px; background:#00ffff; color:#000; padding:6px 12px; border:none; border-radius:4px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="{{ url_for('dreams.dreams') }}" class="back">← Back to Dreams</a>
    <h1>Comments: {{ dream.title }}</h1>
  </div>
  <div class="comments">
    {% for c in comments %}
      <div class="comment">
        <p>{{ c.comment }}</p>
        <small>— {{ c.username }}, {{ c.date_posted }}</small>
      </div>
    {% else %}
      <p style="text-align:center; color:#888">No comments yet.</p>
    {% endfor %}
  </div>
  <form method="POST" style="max-width:600px; margin:20px auto;">
    <textarea name="comment" placeholder="Write your comment…" required></textarea><br>
    <button type="submit">Add Comment</button>
  </form>
</body>
</html>
