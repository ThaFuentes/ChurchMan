<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Announcement</title>
  <style>
    /* Base Styles */
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      background-image: url('{{ url_for("static", filename="images/settings_background.png") }}');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }

    /* Header */
    .header {
      position: relative;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #00FFFF;
    }
    .header h1 {
      margin: 0;
      color: #00FFFF;
      font-size: 2em;
    }
    .back-button {
      position: absolute;
      left: 20px;
      top: 20px;
      background-color: #00FFFF;
      color: #000;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9em;
      transition: transform .2s;
    }
    .back-button:hover {
      transform: scale(1.05);
    }

    /* Form Container */
    .form-container {
      max-width: 600px;
      margin: 30px auto;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #00FFFF;
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #00FFFF;
      border-radius: 4px;
      background-color: #111;
      color: #e0e0e0;
      font-size: 1em;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .checkbox-row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }
    .checkbox-row label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .save-button {
      background-color: #00FFFF;
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background .3s, transform .2s;
      width: 100%;
      font-size: 1em;
    }
    .save-button:hover {
      background: #00e5e5;
      transform: scale(1.02);
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 1.5em; }
      .form-container { margin: 20px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="{{ url_for('announcements.view_announcements') }}" class="back-button">← Back to Announcements</a>
    <h1>Edit Announcement</h1>
  </div>

  <div class="form-container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="color:#00FFFF; text-align:center; margin-bottom:20px;">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('announcements.edit_announcement', id=announcement['id']) }}">
      <label for="title">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        value="{{ announcement['title'] }}"
        required
      />

      <label for="content">Content</label>
      <textarea
        id="content"
        name="content"
        required
      >{{ announcement['content'] }}</textarea>

      <label for="effective_date">Effective Date</label>
      <input
        type="date"
        id="effective_date"
        name="effective_date"
        value="{{ announcement['effective_date'][:10] if announcement['effective_date'] }}"
      />

      <label for="expiration_date">Expiration Date</label>
      <input
        type="date"
        id="expiration_date"
        name="expiration_date"
        value="{{ announcement['expiration_date'][:10] if announcement['expiration_date'] }}"
      />

      <div class="checkbox-row">
        <label>
          <input
            type="checkbox"
            name="is_active"
            {% if announcement['is_active'] %}checked{% endif %}
          /> Active
        </label>
        <label>
          <input
            type="checkbox"
            name="comments_enabled"
            {% if announcement['comments_enabled'] %}checked{% endif %}
          /> Comments Enabled
        </label>
      </div>

      <button type="submit" class="save-button">Save Changes</button>
    </form>
  </div>

</body>
</html>
