<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Event</title>
  <style>
    /* Base Styles */
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      background-image: url('{{ url_for('static', filename='images/event.png') }}');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }
    .header {
      display: flex;
      justify-content: space-between; /* Align the buttons to the left and right */
      align-items: center;
      position: relative;
      background-color: rgba(0,0,0,0.8);
      padding: 20px;
      border-bottom: 2px solid #00FFFF;
    }
    .header h1 {
      margin: 0;
      color: #00FFFF;
      font-size: 2em;
      text-align: center;
      flex-grow: 1; /* Allow the title to grow and take up space between the buttons */
    }
    .back-button {
      background-color: #00FFFF;
      color: #000;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9em;
    }
    .content {
      max-width: 800px;
      margin: 20px auto;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    fieldset {
      border: 1px solid #333;
      border-radius: 5px;
      padding: 20px;
      margin-bottom: 20px;
    }
    legend {
      padding: 0 10px;
      font-weight: bold;
      color: #00FFFF;
    }
    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .form-row label {
      flex: 1 0 200px;
      margin-bottom: 5px;
      line-height: 1.5;
      color: #e0e0e0;
    }
    .form-row input,
    .form-row textarea,
    .form-row button {
      flex: 2 0 400px;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #1f1f1f;
      color: #e0e0e0;
    }
    .form-row input[type="file"] {
      padding: 4px;
    }
    .form-row input[type="checkbox"] {
      width: auto;
      margin-left: 5px;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      outline: none;
      border-color: #00FFFF;
    }
    .btn-submit {
      background-color: #00FFFF;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 4px;
    }
    .btn-submit:hover {
      background-color: #00e5e5;
    }
    @media (max-width: 768px) {
      .form-row { flex-direction: column; }
      .form-row label, .form-row input, .form-row textarea { flex: 1 0 auto; }
      .back-button { position: static; margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <!-- Back to Events on the left -->
    <a href="{{ url_for('event.events') }}" class="back-button">Back to Events</a>

    <!-- Title centered in the header -->
    <h1>Add New Event</h1>

    <!-- Back to Dashboard on the right -->
    <a href="{{ url_for('dashboard') }}" class="back-button">Back to Dashboard</a>
  </div>
  <div class="content">
    <form action="{{ url_for('event.add_event') }}" method="POST">
      <fieldset>
        <legend>Event Details</legend>
        <div class="form-row">
          <label for="event_name">Event Name:</label>
          <input type="text" id="event_name" name="event_name" required>
        </div>
        <div class="form-row">
          <label for="event_date">Event Date:</label>
          <input type="date" id="event_date" name="event_date" required>
        </div>
        <div class="form-row">
          <label for="event_time">Event Time:</label>
          <input type="time" id="event_time" name="event_time" required>
        </div>
        <div class="form-row">
          <label for="location">Location:</label>
          <input type="text" id="location" name="location">
        </div>
        <div class="form-row">
          <label for="description">Description:</label>
          <textarea id="description" name="description" rows="3"></textarea>
        </div>
        <div class="form-row">
          <label for="speaker_host">Speaker/Host:</label>
          <input type="text" id="speaker_host" name="speaker_host">
        </div>
        <div class="form-row">
          <label for="special_guests">Special Guests:</label>
          <input type="text" id="special_guests" name="special_guests">
        </div>
        <div class="form-row">
          <label for="theme">Theme:</label>
          <input type="text" id="theme" name="theme">
        </div>
        <div class="form-row">
          <label for="agenda">Agenda:</label>
          <textarea id="agenda" name="agenda" rows="3"></textarea>
        </div>
        <div class="form-row">
          <label for="registration_info">Registration Info:</label>
          <input type="text" id="registration_info" name="registration_info">
        </div>
        <div class="form-row">
          <label for="cost_fees">Cost/Fees:</label>
          <input type="number" step="0.01" id="cost_fees" name="cost_fees" placeholder="Leave empty if free">
        </div>
        <div class="form-row">
          <label for="contact_info">Contact Information:</label>
          <input type="text" id="contact_info" name="contact_info">
        </div>
        <div class="form-row">
          <label for="childcare_availability">Childcare Availability:</label>
          <input type="text" id="childcare_availability" name="childcare_availability">
        </div>
        <div class="form-row">
          <label for="accessibility">Accessibility:</label>
          <input type="text" id="accessibility" name="accessibility">
        </div>
        <div class="form-row">
          <label for="safety_protocols">Safety Protocols:</label>
          <textarea id="safety_protocols" name="safety_protocols" rows="3"></textarea>
        </div>
        <div class="form-row">
          <label for="is_potluck">Is this a Potluck Event?</label>
          <input type="checkbox" id="is_potluck" name="is_potluck" value="1">
        </div>
        <button type="submit" class="btn-submit">Add Event</button>
      </fieldset>
    </form>
  </div>
</body>
</html>
